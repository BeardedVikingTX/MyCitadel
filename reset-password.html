<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Reset Password — MyCitadel</title>
<link rel="stylesheet" href="https://vendors.mycitadel.lol/css/citadel.css">
<style>
  .rw { max-width: 520px; margin: 3rem auto; padding: 1rem; }
  .panel { margin-bottom: 1.5rem; }
  .out {
    font-family: var(--f-mono);
    font-size: 0.85rem;
    padding: 1rem;
    border-radius: var(--r-sm);
    border-left: 3px solid var(--c-cyan);
    background: var(--c-abyss);
    margin-top: 1rem;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .out.err { border-left-color: var(--c-blood); }
  .out.ok  { border-left-color: var(--c-success); }
  .row { margin-bottom: 0.75rem; }
</style>
</head>
<body>

<header class="citadel-hero">
  <h1 class="citadel-title">Reset Password</h1>
  <p class="citadel-subtitle">Choose a new credential</p>
</header>

<div class="rw">

  <!-- LOADING STATE -->
  <div class="panel" id="loading-panel">
    <h3>Verifying your reset link…</h3>
    <p style="color:var(--c-text-dim);">
      Please wait while we confirm your one-time token.
    </p>
  </div>

  <!-- ERROR STATE (hidden until needed) -->
  <div class="panel" id="error-panel" style="display:none;">
    <h3 style="color:var(--c-blood);">Link invalid or expired</h3>
    <div class="out err" id="error-message">—</div>
    <p style="margin-top:1rem;">
      <a href="/forgot-password" class="btn-cyber" style="display:inline-block;padding:0.75rem 1.75rem;text-decoration:none;">
        Request a new link
      </a>
    </p>
  </div>

  <!-- FORM STATE (hidden until exchange succeeds) -->
  <div class="panel" id="form-panel" style="display:none;">
    <h3>Enter Your New Password</h3>

    <div class="row">
      <input class="form-input" id="pw1" type="password"
             placeholder="New password (12+ characters)"
             autocomplete="new-password" minlength="12">
    </div>

    <div class="row">
      <input class="form-input" id="pw2" type="password"
             placeholder="Confirm new password"
             autocomplete="new-password" minlength="12">
    </div>

    <button class="btn-cyber" id="btn-submit" type="button">
      Reset Password
    </button>

    <div class="out" id="form-output" style="display:none;"></div>
  </div>

  <span class="rune-divider">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ</span>

</div>

<script>
/* ============================================================================
 * PASSWORD RESET — CLIENT FLOW
 * ----------------------------------------------------------------------------
 * 1. Read the reset token from the URL FRAGMENT (never sent to server).
 * 2. Clear the fragment from the URL bar immediately (defense in depth).
 * 3. POST the token to /password_reset_exchange.php → server consumes it and
 *    sets a session authorization flag.
 * 4. Show the password form.
 * 5. On submit, POST the new password to /password_reset_consume.php —
 *    WITHOUT the token. The session flag is the authorization.
 * ========================================================================== */

(function () {
    'use strict';

    const API = 'https://api.mycitadel.lol/v1';
    const CLIENT_HEADER = { 'X-Citadel-Client': 'browser/1.0.0' };

    let csrfToken = null;

    /* ── STEP 1: read fragment ───────────────────────────────────────── */
    const hash = window.location.hash || '';
    const match = hash.match(/token=([a-f0-9]{64})/i);
    const urlToken = match ? match[1] : null;

    /* ── STEP 2: clear the fragment IMMEDIATELY ──────────────────────── */
    // Before we do anything else, wipe the token from the URL bar and
    // from history so it can't be seen in a screenshot, shared, or
    // recovered by a same-origin script after this point.
    if (urlToken) {
        history.replaceState({}, '', window.location.pathname);
    }

    /* ── ELEMENT REFERENCES ──────────────────────────────────────────── */
    const loadingPanel = document.getElementById('loading-panel');
    const errorPanel   = document.getElementById('error-panel');
    const errorMessage = document.getElementById('error-message');
    const formPanel    = document.getElementById('form-panel');
    const formOutput   = document.getElementById('form-output');
    const pw1          = document.getElementById('pw1');
    const pw2          = document.getElementById('pw2');
    const btnSubmit    = document.getElementById('btn-submit');

    /* ── HELPERS ─────────────────────────────────────────────────────── */
    function showError(msg) {
        loadingPanel.style.display = 'none';
        formPanel.style.display    = 'none';
        errorPanel.style.display   = 'block';
        errorMessage.textContent   = msg;
    }

    function showForm() {
        loadingPanel.style.display = 'none';
        errorPanel.style.display   = 'none';
        formPanel.style.display    = 'block';
        pw1.focus();
    }

    function setFormOutput(msg, isError) {
        formOutput.textContent   = msg;
        formOutput.className     = 'out ' + (isError ? 'err' : 'ok');
        formOutput.style.display = 'block';
    }

    /* ── STEP 3: exchange token for session authorization ────────────── */
    async function exchangeToken() {
        if (!urlToken) {
            showError('No reset token found in the link. Please use the link from your email.');
            return;
        }

        try {
            // 3a. Get a CSRF token + session cookie.
            const csrfRes  = await fetch(API + '/auth/csrf.php', {
                credentials: 'include',
                headers: CLIENT_HEADER
            });
            const csrfData = await csrfRes.json();
            csrfToken = csrfData.token;

            // 3b. Exchange the URL token for a session authorization.
            const exRes  = await fetch(API + '/verify/password_reset_exchange.php', {
                method: 'POST',
                credentials: 'include',
                headers: Object.assign({
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': csrfToken
                }, CLIENT_HEADER),
                body: JSON.stringify({ token: urlToken })
            });

            const exData = await exRes.json();

            if (!exRes.ok) {
                showError(exData.message || 'Invalid or expired reset link.');
                return;
            }

            // 3c. Exchange succeeded. Show the form.
            showForm();

        } catch (err) {
            showError('Network error. Please check your connection and try again.');
        }
    }

    /* ── STEP 5: submit the new password ─────────────────────────────── */
    async function submitNewPassword() {
        const p1 = pw1.value;
        const p2 = pw2.value;

        if (!p1 || p1.length < 12) {
            setFormOutput('Password must be at least 12 characters.', true);
            return;
        }
        if (p1 !== p2) {
            setFormOutput('Passwords do not match.', true);
            return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Resetting…';

        try {
            const res  = await fetch(API + '/verify/password_reset_consume.php', {
                method: 'POST',
                credentials: 'include',
                headers: Object.assign({
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': csrfToken
                }, CLIENT_HEADER),
                body: JSON.stringify({ password: p1 })
            });

            const data = await res.json();

            if (!res.ok) {
                setFormOutput(data.message || 'Could not reset your password.', true);
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Reset Password';
                return;
            }

            // Success — show message, then redirect.
            setFormOutput('Password reset. Redirecting to dashboard…', false);

            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 1500);

        } catch (err) {
            setFormOutput('Network error. Please try again.', true);
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Reset Password';
        }
    }

    btnSubmit.addEventListener('click', submitNewPassword);

    // Enter key on either password field submits
    [pw1, pw2].forEach(el => {
        el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitNewPassword();
        });
    });

    /* ── BOOT ────────────────────────────────────────────────────────── */
    exchangeToken();

})();
</script>

</body>
</html>
